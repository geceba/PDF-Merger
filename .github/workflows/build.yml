name: Build and Release PDF Merger

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instalamos pypdf y pytest explícitamente para asegurar su registro
        python -m pip install pypdf pytest pyinstaller
        python -m pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        # Añadimos la carpeta 'src' al path para que encuentre 'core'
        $env:PYTHONPATH = "src"
        python -m pytest src/tests

    - name: Build with PyInstaller
      if: success()
      run: |
        # Ejecutamos PyInstaller como módulo para evitar errores de comando no encontrado
        python -m PyInstaller --noconsole --onefile -n "PDF-Merger" --collect-all tkinterdnd2 --add-data "icons;icons" --icon "icons/favicon.ico" main.py

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/PDF-Merger.exe
        name: Release ${{ github.ref_name }}
        body: |
          Build automático de PDF Merger.
          - Lógica de combinación de PDFs (pypdf).
          - Interfaz gráfica con soporte Drag & Drop.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}